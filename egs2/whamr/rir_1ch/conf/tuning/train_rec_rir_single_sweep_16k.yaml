seed: 0
init_param: []
init: null
max_epoch: 100
use_amp: false
grad_clip: 1.0
batch_type: folded
batch_size: 4
num_workers: 4
sample_rate: 16000
force_single_channel: true
rir_model_type: rec_rir_sweep
preprocessor: rec_rir_sweep
preprocessor_conf:
  speech_segment: 64000
  force_single_channel: true
  rir_length: 32000
  rir_peak_index: 40
model_conf:
  extract_feats_in_collect_stats: false
  sr: 16000
  n_fft: 512
  win_len: 512
  hop_len: 256
  win_type: sqrthann
  dim_input: 2
  dim_output_spch: 2
  dim_output_CTF: 120
  dim_hidden: 96
  dim_squeeze: 8
  num_freqs: 257
  num_layers_spch: 6
  num_layers_noise: 2
  num_layers_CTF: 6
  encoder_kernel_size: 5
  dropout:
  - 0.0
  - 0.0
  - 0.0
  kernel_size:
  - 5
  - 3
  conv_groups:
  - 8
  - 8
  norms:
  - LN
  - LN
  - LN
  - LN
  - LN
  - LN
  full_share: 0
  attention: mamba(16,4)
  loss_type: RIMag
  normalize_by_mix: true
  pim_sweep_duration: 8.192
optim: adamw
optim_conf:
  lr: 0.001
  eps: 1.0e-08
  weight_decay: 0.0
patience: 10
val_scheduler_criterion:
- valid
- loss
best_model_criterion:
- - valid
  - loss
  - min
keep_nbest_models: 5
scheduler: cosineannealingwarmrestarts
scheduler_conf:
  T_0: 5000
  T_mult: 1
  eta_min: 0.0
