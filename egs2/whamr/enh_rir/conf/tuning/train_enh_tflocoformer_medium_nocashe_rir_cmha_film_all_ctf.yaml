init: xavier_uniform
max_epoch: 150
use_amp: false
batch_type: folded
batch_size: 8
accum_grad: 1
num_workers: 4

# preprocessor
preprocessor: enh
num_spk: &num_spk 2
iterator_type: sequence
speech_segment: 32000
shuffle_within_batch: true
force_single_channel: true

# espnet model configuration
model_conf:
    normalize_variance: true
    rir_condition_type: rir_ctf

# optimizer and scheduler
optim: adamw
optim_conf:
    lr: 1.0e-03
    eps: 1.0e-08
    weight_decay: 1.0e-02
patience: 10
val_scheduler_criterion:
- valid
- loss
best_model_criterion:
-   - valid
    - si_snr
    - max
-   - valid
    - loss
    - min
keep_nbest_models: 5
scheduler: warmupreducelronplateau
scheduler_conf:
    warmup_steps: 4000
    mode: min
    factor: 0.5
    patience: 3

# model configuration
encoder: &encoder stft
encoder_conf:
    n_fft: &n_fft 256
    hop_length: &hop_length 64
decoder: *encoder
decoder_conf:
    n_fft: *n_fft
    hop_length: *hop_length
separator: tflocoformer_nocashe_rir_cmha_film_all_ctf
separator_conf:
    num_spk: *num_spk
    n_layers: 6
    emb_dim: 128
    norm_type: rmsgroupnorm
    num_groups: 4
    tf_order: ft
    n_heads: 4
    flash_attention: false
    ffn_type:
        - swiglu_conv1d
        - swiglu_conv1d
    ffn_hidden_dim:
        - 192
        - 192
    conv1d_kernel: 8
    conv1d_shift: 1
    dropout: 0.0
    eps: 1.0e-5

criterions:
  - name: si_snr
    conf:
        eps: 1.0e-7
    wrapper: pit
    wrapper_conf:
        weight: 1.0
        independent_perm: true
