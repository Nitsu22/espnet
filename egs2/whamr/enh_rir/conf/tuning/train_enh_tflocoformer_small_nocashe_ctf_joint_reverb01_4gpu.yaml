# Match TSUBAME enh1/exp/enh_train_enh_tflocoformer_nocashe_small_4gpu.
# Only the CTF head and 1:0.1 clean/reconstructed-reverb objective are added.
seed: 0
init: xavier_uniform
init_param: []
max_epoch: 150
use_amp: false
train_dtype: float32
batch_type: folded
batch_size: 4
num_workers: 4
accum_grad: 1
grad_clip: 5.0
iterator_type: sequence
shuffle_within_batch: true
preprocessor: enh
num_spk: 2
sample_rate: 8000
speech_segment: 32000
force_single_channel: true
dynamic_mixing: false

model_conf:
    normalize_variance: true
    loss_w_clean: 1.0
    loss_w_reverb: 0.1

optim: adamw
optim_conf:
    lr: 1.0e-3
    eps: 1.0e-8
    weight_decay: 1.0e-2
patience: 10
# Monitor clean quality, as baseline valid.loss was clean SI-SNR alone.
early_stopping_criterion: [valid, loss_clean_pit, min]
val_scheduler_criterion: [valid, loss_clean_pit]
best_model_criterion:
    - [valid, si_snr, max]
    - [valid, loss_clean_pit, min]
    - [valid, loss, min]
keep_nbest_models: 5
scheduler: warmupreducelronplateau
scheduler_conf:
    warmup_steps: 4000
    mode: min
    factor: 0.5
    patience: 3

encoder: stft
encoder_conf:
    n_fft: 256
    hop_length: 64
decoder: stft
decoder_conf:
    n_fft: 256
    hop_length: 64
separator: tflocoformer_nocashe_ctf
separator_conf:
    num_spk: 2
    n_layers: 4
    emb_dim: 96
    norm_type: rmsgroupnorm
    num_groups: 4
    tf_order: ft
    n_heads: 4
    flash_attention: false
    ffn_type: [swiglu_conv1d, swiglu_conv1d]
    ffn_hidden_dim: [128, 128]
    conv1d_kernel: 8
    conv1d_shift: 1
    dropout: 0.0
    eps: 1.0e-5
    # 8-ms hop: 120 taps cover ~0.96 s, like 60 taps at a 16-ms hop.
    ctf_taps: 120

criterions:
    - name: si_snr
      conf:
          eps: 1.0e-7
      wrapper: pit
      wrapper_conf:
          weight: 1.0
          independent_perm: true
