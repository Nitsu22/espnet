seed: 0
init_param: []
init: null
max_epoch: 100
use_amp: false
grad_clip: 1.0
batch_type: folded
batch_size: 4
num_workers: 4
sample_rate: 16000
force_single_channel: true
rir_model_type: pooled_bimamba_sweep_v2_pit
preprocessor: rec_rir_sweep_v2_pit
preprocessor_conf:
  speech_segment: 64000
  force_single_channel: true
  rir_length: 32000
model_conf:
  extract_feats_in_collect_stats: false
  sr: 16000
  n_fft: 512
  win_len: 512
  hop_len: 256
  win_type: sqrthann
  num_freqs: 257
  loss_type: RIMag
  normalize_by_mix: true
  pim_sweep_duration: 8.192
  num_spk: 2
  ctf_taps: 60
  predictor_conf:
    emb_dim: 64
    pre_layers: 2
    post_layers: 0
    d_state: 16
    d_conv: 4
    freq_bottleneck: 16
    freq_rank: 16
    local_kernel: 5
    pooling_hidden: 32
    n_heads: 4
    ffn_dim: 128
    head_dim: 128
    slot_embedding_std: 0.02
    eps: 1.0e-5
optim: adamw
optim_conf:
  lr: 0.001
  eps: 1.0e-08
  weight_decay: 0.0
patience: 10
val_scheduler_criterion:
- valid
- loss
best_model_criterion:
- - valid
  - loss
  - min
keep_nbest_models: 5
scheduler: cosineannealingwarmrestarts
scheduler_conf:
  T_0: 5000
  T_mult: 1
  eta_min: 0.0
