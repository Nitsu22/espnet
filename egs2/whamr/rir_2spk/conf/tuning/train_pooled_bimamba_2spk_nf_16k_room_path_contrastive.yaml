seed: 0
init_param: []
init: null
max_epoch: 100
use_amp: false
grad_clip: 1.0
batch_type: unsorted
batch_size: 2
valid_batch_type: unsorted
valid_batch_size: 1
shuffle_within_batch: true
max_cache_size: 0
num_workers: 4
sample_rate: 16000
force_single_channel: true
rir_model_type: pooled_bimamba_room_path_contrastive
preprocessor: rec_rir_room_path_contrastive
preprocessor_conf:
  speech_segment: 64000
  force_single_channel: true
  rir_length: 32000
model_conf:
  lambda_room: 0.01
  lambda_path: 0.01
  contrastive_temperature: 0.1
  projection_dim: 32
  validation_contrastive: false
  extract_feats_in_collect_stats: false
  sr: 16000
  n_fft: 512
  win_len: 512
  hop_len: 256
  win_type: sqrthann
  num_freqs: 257
  loss_type: RIMag
  normalize_by_mix: true
  pim_sweep_duration: 8.192
  num_spk: 2
  ctf_taps: 60
  predictor_conf:
    emb_dim: 64
    pre_layers: 4
    post_layers: 2
    d_state: 16
    d_conv: 4
    freq_bottleneck: 16
    freq_rank: 16
    local_kernel: 5
    pooling_hidden: 32
    n_heads: 4
    ffn_dim: 128
    head_dim: 128
    slot_embedding_std: 0.02
    eps: 1.0e-5
    room_path_factorized: true
optim: adamw
optim_conf:
  lr: 0.001
  eps: 1.0e-08
  weight_decay: 0.0
patience: 10
early_stopping_criterion:
- valid
- loss_sweep
- min
val_scheduler_criterion:
- valid
- loss_sweep
best_model_criterion:
- - valid
  - loss_sweep
  - min
keep_nbest_models: 5
scheduler: cosineannealingwarmrestarts
scheduler_conf:
  T_0: 5000
  T_mult: 1
  eta_min: 0.0
